<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Outside work</title>
  <desc id="desc">Fitness, planting, socialising with friends, and hiking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .panel { fill: #ffffff; fill-opacity: .05; stroke-width: 1.5; stroke-opacity: .6; }
    .ico { fill: none; stroke: #ffffff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: #ffffff; stroke: none; }
    .card, .move { transform-box: fill-box; transform-origin: center; }
    .card { animation: lift 4s ease-in-out infinite; }
    .k2 { animation-delay: .5s; } .k3 { animation-delay: 1s; } .k4 { animation-delay: 1.5s; }
    .pump { animation: pump 2.4s ease-in-out infinite; }
    .sway { transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite; }
    .hop { animation: hop 2.2s ease-in-out infinite; }
    .hop.late { animation-delay: 1.1s; }
    .sun { animation: sun 3s ease-in-out infinite; }
    @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pump { 0%, 100% { transform: translateY(4px) rotate(-8deg); } 50% { transform: translateY(-4px) rotate(8deg); } }
    @keyframes sway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
    @keyframes sun { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.35); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1000" height="190" rx="22" fill="url(#bg)"/>

  <g class="card">
    <rect class="panel" x="40" y="25" width="215" height="140" rx="16" stroke="url(#c1)"/>
    <circle cx="147.500" cy="78" r="30" fill="url(#c1)"/>
    <g transform="translate(147.500 78)">
      <g class="ico move pump">
        <path d="M-12 0H12"/>
        <rect x="-18" y="-10" width="6" height="20" rx="2"/>
        <rect x="12" y="-10" width="6" height="20" rx="2"/>
        <path d="M-22 -5V5M22 -5V5"/>
      </g>
    </g>
    <text x="147.500" y="142">Fitness</text>
  </g>

  <g class="card k2">
    <rect class="panel" x="275" y="25" width="215" height="140" rx="16" stroke="url(#c2)"/>
    <circle cx="382.500" cy="78" r="30" fill="url(#c2)"/>
    <g transform="translate(382.500 78)">
      <path class="ico" d="M-13 17H13"/>
      <g class="ico move sway">
        <path d="M0 17V-3"/>
        <path d="M0 5C-11 5 -16 -3 -16 -9C-7 -9 0 -5 0 5Z"/>
        <path d="M0 -3C0 -13 7 -18 16 -18C16 -9 10 -3 0 -3Z"/>
      </g>
    </g>
    <text x="382.500" y="142">Planting</text>
  </g>

  <g class="card k3">
    <rect class="panel" x="510" y="25" width="215" height="140" rx="16" stroke="url(#c3)"/>
    <circle cx="617.500" cy="78" r="30" fill="url(#c3)"/>
    <g transform="translate(617.500 78)">
      <g class="ico move hop">
        <circle cx="-9" cy="-8" r="5.500"/>
        <path d="M-19 15C-19 7 -15 2 -9 2C-5 2 -2 4 0 7"/>
      </g>
      <g class="ico move hop late">
        <circle cx="9" cy="-8" r="5.500"/>
        <path d="M19 15C19 7 15 2 9 2C5 2 2 4 0 7"/>
      </g>
    </g>
    <text x="617.500" y="142">Time with friends</text>
  </g>

  <g class="card k4">
    <rect class="panel" x="745" y="25" width="215" height="140" rx="16" stroke="url(#c4)"/>
    <circle cx="852.500" cy="78" r="30" fill="url(#c4)"/>
    <g transform="translate(852.500 78)">
      <circle class="solid move sun" cx="13" cy="-13" r="4"/>
      <path class="ico" d="M-21 15L-7 -9L1 4L6 -3L21 15Z"/>
      <path class="ico" d="M-11 -2L-7 2L-3 -2"/>
    </g>
    <text x="852.500" y="142">Hiking</text>
  </g>
</svg>
